<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ad Augusta Collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="stylesheet" href="/assets/css/index.css" />
  </head>
  <body>
    <header class="hub-hero">
      <div class="hub-hero-inner">
        <img
          class="hub-crest"
          src="/collection/may-26/publication-web-resources/image/AGSLogo2021-Crest-Standard.svg"
          alt="Auckland Grammar School crest"
        />
        <div class="hub-kicker">Auckland Grammar School</div>
        <h1 class="hub-title">Ad Augusta Collection</h1>
        <p class="hub-sub">The digital archive of Ad Augusta magazine</p>
      </div>
    </header>

    <main class="hub-archive">
      <div class="row">
        <a class="latest issue-card" href="/collection/nov-26/index.html">
          <img
            src="/collection/nov-26/publication-web-resources/Thumbnails/publication.png"
            alt="Cover — Ad Augusta, November 2026"
            loading="lazy"
            decoding="async"
          />
          <div class="issue-body">
            <h5 class="issue-title">Ad Augusta</h5>
            <div class="issue-meta">November <br class="meta-break" />2026</div>
            <div class="issue-cta">Read magazine ></div>
          </div>
        </a>

        <div class="older-ones">
          <a class="issue-card" href="/collection/may-26/index.html">
            <img
              src="/collection/may-26/publication-web-resources/Thumbnails/publication.jpg"
              alt="Cover — Ad Augusta, May 2026"
              loading="lazy"
              decoding="async"
            />
            <div class="issue-body">
              <div class="issue-year">2026</div>
              <div class="issue-month">May</div>
              <div class="issue-cta">Read magazine ></div>
            </div>
          </a>
        </div>
      </div>
    </main>

    <footer class="hub-footer">
      Ad Augusta — Auckland Grammar School Magazine.
      <p style="margin:0 auto"><a href="https://ags.recollect.co.nz/nodes/view/4">Ad Augustas on Recollect</a></p>
    </footer>

    <script
      async
      src="https://www.googletagmanager.com/gtm.js?id=GTM-57Q8ZW4Q"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
    </script>
  </body>
</html>
